<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms Demo</title>
  </head>
  <body>
    <h1>Forms demo</h1>
    <form action="/tt">
      <p>
        <label for="username">Enter a username</label>
        <input
          id="username"
          type="text"
          placeholder="username"
          name="username"
        />
      </p>
      <p>
        <label for="password">Enter a password</label>
        <input
          id="password"
          type="password"
          placeholder="password"
          name="password"
        />
      </p>
      <p>
        <label for="color">Pick a color</label>
        <input id="color" type="color" name="color" />
      </p>
      <p>
        <label for="num">Enter a number</label>
        <input
          id="num"
          type="number"
          placeholder="enter a number"
          name="number"
        />
      </p>
      <p><input type="time" /></p>
      <button type="">will Submit</button>
      <button type="button">wont Submit</button>
    </form>
    <h2>Searching</h2>
    <form action="https://www.reddit.com/search">
      <input type="text" name="q" id="" />
      <button>submit</button>
    </form>
    <h2>More inputs</h2>
    <form action="/birds">
      <label for="agree">I agree</label>
      <input type="checkbox" name="agree" id="agree" checked />
      <button>Submit</button>
    </form>
    <h2>Radio</h2>
    <form action="/stuff">
      <p><input type="radio" name="a" value="a" /> <label for="a">a</label></p>
      <p><input type="radio" name="b" value="b" /> <label for="b">b</label></p>
      <p><input type="radio" name="c" value="c" /><label for="c">c</label></p>
      <button>submit</button>
    </form>
    <h2>Select</h2>
    <form action="/stuff">
      <p>
        <label for="food">please select meal</label>
        <select name="food" id="food">
          <option value="">Please select a meal</option>
          <option value="cow">cow</option>
          <option value="chicken">chicken</option>
          <option value="fish">fish</option>
          <option value="veg">veg</option>
        </select>
      </p>
      <button>submit</button>
    </form>
    <form action="/stuff">
      <label for="cheese">amount of cheese</label>
      <p>
        <input type="range" name="cheese" id="cheese" min="1" max="50" />
        <button>chese</button>
      </p>
      <p>
        <label for="rec">any recs</label>
        <textarea name="rec" id="rec" cols="30" rows="10"></textarea>
      </p>
    </form>
    <form action="">
      <p>
        <label for="username">Enter a username</label>
        <input
          type="text"
          name="username"
          id="username"
          placeholder="username"
        />
      </p>
      <p>
        <label for="password">Enter a password</label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="password"
        />
      </p>
      <button>Register</button>
    </form>
    <h2>Validation Demo</h2>
    <form action="">
      <p>
        <label for="first">Enter first name</label>
        <input type="text" name="first" id="first" required />
      </p>
      <p>
        <label for="username">username</label>
        <input
          type="text"
          name="username"
          id="username"
          minlength="5"
          maxlength="13"
          required
        />
      </p>
      <button>Submit</button>
    </form>
  </body>
</html>
